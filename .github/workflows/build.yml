name: Build Windows executable

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*", "v*.*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean Segue.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Segue-win64
          path: dist/Segue
          if-no-files-found: error

      - name: Package release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/Segue/* -DestinationPath dist/Segue-win64.zip

      - name: Generate SHA256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $hash = (Get-FileHash -Path dist/Segue-win64.zip -Algorithm SHA256).Hash
          "$hash  Segue-win64.zip" | Out-File -FilePath dist/Segue-win64.zip.sha256 -Encoding ascii

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "$PREV_TAG..${GITHUB_REF_NAME}" > CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" > CHANGELOG.md
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/Segue-win64.zip
            dist/Segue-win64.zip.sha256
